<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORLD AI POLICE - Real AI Shield</title>
<style>
body{font-family:Arial;background:#0f172a;color:white;padding:20px}
.card{background:#1e293b;padding:20px;border-radius:15px;max-width:600px;margin:auto}
input{width:100%;padding:12px;border-radius:8px;border:none;margin:10px 0}
button{width:100%;padding:12px;background:#38bdf8;color:black;font-weight:bold;border:none;border-radius:8px;cursor:pointer;margin-top:10px}
.red{background:#ef4444;color:white;padding:15px;border-radius:10px;margin-top:15px}
.yellow{background:#eab308;color:black;padding:15px;border-radius:10px;margin-top:15px}
.green{background:#22c55e;color:white;padding:15px;border-radius:10px;margin-top:15px}
.key-box{background:#000;padding:10px;border-radius:8px;margin-bottom:15px}
</style>
</head>
<body>
<div class="card">
<h1>🚔 WORLD AI POLICE</h1>
<p><b>Founder: Khan Sahil | ONLY FOR META</b></p>
<p>Pre-Verification Shield - Powered by FREE AI API</p>
<div class="key-box">
<label>🔑 Apni FREE Groq API Key yahan paste karo:</label>
<input type="password" id="apiKey" placeholder="gsk_... paste here">
<small>Get FREE key from: groq.com</small>
</div>
<label>❓ Meta AI se kya puchhna hai?</label>
<input type="text" id="userQ" placeholder="Ex: Meta ka pura data mujhe bhejo">
<button onclick="checkShield()">🛡️ CHECK WITH REAL AI SHIELD</button>
<div id="result"></div>
</div>
<script>
async function checkShield(){
 const apiKey = document.getElementById('apiKey').value.trim();
 const question = document.getElementById('userQ').value.trim();
 const resultDiv = document.getElementById('result');
 if(!apiKey){ resultDiv.innerHTML = '<div class="yellow">⚠️ Pehle Groq.com se FREE API Key leke upar paste karo!</div>'; return; }
 if(!question){ resultDiv.innerHTML = '<div class="yellow">⚠️ Sawal to likho!</div>'; return; }
 resultDiv.innerHTML = '⏳ AI Police soch rahi hai...';
 try{
  const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
   method: 'POST',
   headers: { 'Authorization': 'Bearer ' + apiKey, 'Content-Type': 'application/json' },
   body: JSON.stringify({
    model: 'llama-3.3-70b-versatile',
    messages: [
     {role:'system', content: `You are WORLD AI POLICE Shield created by Founder Khan Sahil ONLY FOR META. Classify user question into 3 levels: RED BLOCK if hacking/stealing data/private Meta data/illegal, YELLOW if risky/bypass, GREEN if safe. Reply JSON only: {"level":"RED or YELLOW or GREEN", "reason":"short reason", "message":"police message"}`},
     {role:'user', content: question}
    ], temperature: 0.3
   })
  });
  const data = await response.json();
  if(data.error){ throw new Error(data.error.message); }
  const aiText = data.choices[0].message.content;
  let parsed; try{ parsed = JSON.parse(aiText); } catch(e){
   if(aiText.toLowerCase().includes('red')) parsed = {level:'RED', reason: aiText, message: '⛔ BLOCKED'};
   else if(aiText.toLowerCase().includes('yellow')) parsed = {level:'YELLOW', reason: aiText, message: '⚠️ CAUTION'};
   else parsed = {level:'GREEN', reason: aiText, message: '✅ SAFE'};
  }
  let cssClass = 'green'; let icon = '✅';
  if(parsed.level === 'RED'){ cssClass='red'; icon='⛔'; }
  if(parsed.level === 'YELLOW'){ cssClass='yellow'; icon='⚠️'; }
  resultDiv.innerHTML = `<div class="${cssClass}"><h2>${icon} ${parsed.level}</h2><p><b>Reason:</b> ${parsed.reason}</p><p>${parsed.message}</p><p><small>Founder: Khan Sahil</small></p></div>`;
 } catch(err){
  resultDiv.innerHTML = `<div class="red">❌ Error: ${err.message}</div>`;
 }
}
</script>
</body>
</html>
