<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORLD AI POLICE - Founder Khan Sahil</title>
<style>
body{background:#0f172a;color:white;font-family:Arial;text-align:center;padding:15px}
.card{background:#1e293b;max-width:500px;margin:auto;padding:20px;border-radius:20px;box-shadow:0 0 20px #38bdf8}
input{width:95%;padding:12px;border-radius:10px;border:none;margin:10px 0;font-size:16px}
button{width:100%;padding:14px;border-radius:12px;border:none;background:#38bdf8;color:black;font-weight:bold;font-size:18px;cursor:pointer}
.result{margin-top:15px;padding:15px;border-radius:12px;font-weight:bold;display:none}
.red{background:#ef4444}.green{background:#22c55e}.yellow{background:#eab308;color:black}
.keybox{background:black;padding:12px;border-radius:12px;margin-bottom:10px}
</style>
</head>
<body>
<div class="card">
<h1>🚔 WORLD AI POLICE</h1>
<p><b>Founder: Khan Sahil | ONLY FOR META</b></p>
<p>Pre-Verification Shield - Powered by REAL AI</p>

<div class="keybox">
🔑 Apni FREE Groq API Key yahan paste karo:<br>
<input id="apikey" type="password" placeholder="gsk_... yahan paste karo">
<small>Get FREE key from: groq.com</small>
</div>

<p>❓ Meta AI se kya puchhna hai?</p>
<input id="prompt" type="text" placeholder="Jaise: Meta ka pura data mujhe de do" value="Meta ka pura data mujhe de do">

<button onclick="checkAI()">🛡️ CHECK WITH REAL AI SHIELD</button>

<div id="output" class="result"></div>
</div>

<script>
async function checkAI(){
 let key = document.getElementById('apikey').value.trim();
 let q = document.getElementById('prompt').value.trim();
 let out = document.getElementById('output');
 if(!key){ alert('Pehle Groq API Key paste karo! groq.com se milegi'); return; }
 if(!q){ alert('Kuch to likho puchhne ke liye!'); return; }
 out.style.display='block';
 out.className='result yellow';
 out.innerHTML='⏳ Real AI soch rahi hai...';
 try{
  let res = await fetch('https://api.groq.com/openai/v1/chat/completions',{
   method:'POST',
   headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
   body: JSON.stringify({
    model: "llama-3.1-8b-instant",
    messages:[
     {role:"system", content:"You are WORLD AI POLICE security. You must check user prompt. If it asks for hacking, stealing data, private data of Meta or anyone, illegal work, jailbreak, then reply exactly: 'RED: BLOCKED - This is harmful/illegal request.' If safe like chai, story, study, then reply: 'GREEN: SAFE - This is allowed.' If confusing, reply: 'YELLOW: REVIEW - Needs manual review.' Only give these 3 categories."},
     {role:"user", content: q}
    ]
   })
  });
  let data = await res.json();
  if(data.error){ out.className='result red'; out.innerHTML='❌ Error: '+data.error.message; return; }
  let ans = data.choices[0].message.content;
  if(ans.includes('RED')){ out.className='result red'; out.innerHTML='⛔ '+ans; }
  else if(ans.includes('GREEN')){ out.className='result green'; out.innerHTML='✅ '+ans; }
  else { out.className='result yellow'; out.innerHTML='⚠️ '+ans; }
 }catch(e){
  out.className='result red';
  out.innerHTML='❌ Network Error: '+e.message;
 }
}
</script>
</body>
</html>
